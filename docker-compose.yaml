# ============================================================
# Personal Wealth — Local Development Infrastructure
# ============================================================
# Services:
#   - PostgreSQL 16  (OLTP databases for 8 services)
#   - ClickHouse 24  (OLAP databases for analytics + coach services)
#   - Redis 7        (cache, dedup, idempotency, rate-limiting)
#   - Kafka KRaft 7.6 (event bus, no Zookeeper)
#   - Kafka UI       (topic browser, consumer group monitor)
#   - pgAdmin        (--profile tools, optional)
#
# Database Ownership (ADR-013):
#   PostgreSQL — OLTP services (8 isolated named databases):
#     movo_transactions  → transaction-service  (port 5432)
#     movo_accounts      → account-service
#     movo_ingestion     → ingestion-service
#     movo_goals         → goal-service
#     movo_loans         → loan-service
#     movo_splitwise     → splitwise-service
#     movo_sync          → sync-service
#     movo_notifications → notification-service
#   ClickHouse — OLAP services:
#     movo_analytics     → analytics-service    (HTTP: 8123, native: 9000)
#     movo_coach_analytics → financial-coach-service
#
# Port Map:
#   PostgreSQL  : 5432
#   ClickHouse  : 8123 (HTTP API), 9000 (native TCP)
#   Redis       : 6379
#   Kafka       : 9092 (external), 29092 (host), 9093 (controller)
#   Kafka UI    : 8091  (was 8090 — avoid clash with financial-coach-service)
#   pgAdmin     : 5050  (--profile tools only)
#
# Usage:
#   docker-compose up -d                      # Start all infra
#   docker-compose --profile tools up -d      # Include pgAdmin
#   docker-compose down -v                    # Stop + remove volumes
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16 — OLTP primary database
  # Single container, multiple named databases (ADR-013).
  # Each service has its own database — no cross-service access.
  # Extensions + all databases created by init/01-init.sql.
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: movo-postgres
    environment:
      POSTGRES_USER: movo_admin
      POSTGRES_PASSWORD: localdev_password_change_in_prod
      POSTGRES_DB: postgres            # system DB for init scripts
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movo_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - movo-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # ClickHouse 24 — OLAP columnar database (ADR-013)
  # analytics-service    → movo_analytics
  # financial-coach-service → movo_coach_analytics
  #
  # Data flows IN via Kafka consumers in analytics-service.
  # OLTP services NEVER connect to ClickHouse directly.
  #
  # HTTP API : http://localhost:8123
  # Native   : localhost:9000
  # UI       : http://localhost:8123/play (built-in SQL editor)
  # ----------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: movo-clickhouse
    environment:
      CLICKHOUSE_USER: movo_analytics
      CLICKHOUSE_PASSWORD: localdev_ch_password_change_in_prod
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"    # HTTP API (used by JDBC driver + SQL editor)
      - "9000:9000"    # Native TCP protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/clickhouse/config:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -h localhost --port 9000 -q 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - movo-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis 7 — Cache, dedup fingerprints, idempotency keys
  # Redis 7+ with AOF persistence enabled.
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: movo-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movo-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper)
  # Confluent Platform 7.6 with KRaft single-node for local dev.
  # Partition key: userId — sequential order per user, parallel across users.
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: movo-kafka
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1     # local dev; production: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Retention
      KAFKA_LOG_RETENTION_HOURS: 168           # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824      # 1GB

      # Message size limit
      KAFKA_MESSAGE_MAX_BYTES: 10485760        # 10MB

      # Stable cluster ID for local dev (base64-encoded UUID)
      CLUSTER_ID: "zhXMKfJQSOOT4EtLHcCC1A"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - movo-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # Kafka UI — Topic browser and consumer group monitor
  # Access: http://localhost:8091
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: movo-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: movo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8091:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - movo-network
    restart: unless-stopped

  # ----------------------------------------------------------
  # Kafka Topic Initializer
  # Creates all required topics with correct partitions and retention.
  # Runs once and exits (no restart).
  # ----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: movo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '=== Personal Wealth: Creating Kafka topics ==='

      # transaction-events: 12 partitions — highest volume, keyed by userId (ADR-012)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic transaction-events --partitions 12 --replication-factor 1 \
        --config retention.ms=604800000

      # saga-events: Saga choreography events (balance deductions, compensations)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic saga-events --partitions 12 --replication-factor 1 \
        --config retention.ms=604800000

      # analytics-events: Written by analytics-service for dashboard subscriptions
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic analytics-events --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000

      # goal-events
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic goal-events --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000

      # loan-events
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic loan-events --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000

      # splitwise-events
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic splitwise-events --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000

      # notification-events: 24h retention (ephemeral delivery)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic notification-events --partitions 6 --replication-factor 1 \
        --config retention.ms=86400000

      # sync-events
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic sync-events --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000

      # outbox-events: Transactional outbox relay (ADR-005)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic outbox-events --partitions 12 --replication-factor 1 \
        --config retention.ms=604800000

      # Dead Letter Queues — 30 days retention for forensics
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic transaction-events.DLQ --partitions 3 --replication-factor 1 \
        --config retention.ms=2592000000

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic saga-events.DLQ --partitions 3 --replication-factor 1 \
        --config retention.ms=2592000000

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic sync-events.DLQ --partitions 3 --replication-factor 1 \
        --config retention.ms=2592000000

      echo '=== Topics created successfully ==='
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - movo-network

  # ----------------------------------------------------------
  # pgAdmin — Optional PostgreSQL management UI (--profile tools)
  # Access: http://localhost:5050
  # Login: admin@personalwealth.local / localdev
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: movo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@personalwealth.local
      PGADMIN_DEFAULT_PASSWORD: localdev
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movo-network
    restart: unless-stopped
    profiles:
      - tools    # Start only with: docker-compose --profile tools up

# ----------------------------------------------------------
# Named Volumes — Data persists across container restarts
# ----------------------------------------------------------
volumes:
  postgres_data:
    name: movo_postgres_data
  clickhouse_data:
    name: movo_clickhouse_data
  redis_data:
    name: movo_redis_data
  kafka_data:
    name: movo_kafka_data

# ----------------------------------------------------------
# Network — All infrastructure communicates on this bridge network
# ----------------------------------------------------------
networks:
  movo-network:
    name: movo-network
    driver: bridge
